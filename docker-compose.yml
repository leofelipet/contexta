services:
  postgres:
    # Requires pgvector. If upgrading an existing volume fails to CREATE EXTENSION,
    # back up data first, then recreate the volume (docker compose down -v).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: contexta
      POSTGRES_USER: contexta
      POSTGRES_PASSWORD: contexta
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - contexta-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexta -d contexta"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["backend"]
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://contexta:contexta@postgres:5432/contexta?sslmode=disable
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      API_BEARER_TOKEN: ${API_BEARER_TOKEN}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      UAZAPI_BASE_URL: ${UAZAPI_BASE_URL}
      UAZAPI_TOKEN: ${UAZAPI_TOKEN}
      UAZAPI_INSTANCE_ID: ${UAZAPI_INSTANCE_ID}
      UAZAPI_WEBHOOK_SECRET: ${UAZAPI_WEBHOOK_SECRET}
      UAZAPI_WEBHOOK_PUBLIC_URL: ${UAZAPI_WEBHOOK_PUBLIC_URL}
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      GROQ_TRANSCRIPTION_LANGUAGE: ${GROQ_TRANSCRIPTION_LANGUAGE:-pt}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8082}:8080"

  migrate:
    profiles: ["backend"]
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://contexta:contexta@postgres:5432/contexta?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  contexta-postgres:
